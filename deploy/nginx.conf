# ── MOD-U-GO Nginx reverse proxy (Hostinger Cloud VPS) ──────────────────────
# Serves the built frontend as static files and proxies /api to Node (PM2).
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/modugo
#   sudo ln -s /etc/nginx/sites-available/modugo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (Let's Encrypt) — after DNS A record points at this VPS:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d exam.yourdomain.edu -d www.exam.yourdomain.edu
#   # auto-renewal is installed by certbot; verify with:
#   sudo certbot renew --dry-run

server {
    listen 80;
    listen [::]:80;
    server_name exam.yourdomain.edu;   # ← change

    # Certbot will add the 301 redirect to HTTPS automatically.

    # Uploads are metadata-only JSON (1 MB cap enforced by Express too)
    client_max_body_size 2m;

    # ── Built React frontend (static) ────────────────────────────────
    # Decision: the frontend IS served from this VPS. Build with
    # `npm run build` in frontend/ and deploy dist/ here.
    root /var/www/modugo/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback for react-router
    }

    # Cache fingerprinted Vite assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy → Node (PM2, port 5000, loopback only) ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Exam autosaves are small & frequent; keep timeouts modest so a hung
        # worker frees up quickly.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Never expose the raw Node port or health internals beyond /health
    location = /health {
        proxy_pass http://127.0.0.1:5000;
    }
}
